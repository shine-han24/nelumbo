<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>nelumbo</title>

  <!--
    연꽃 마크.

    16px까지 줄어들어도 형태가 남아야 한다. 잎마다 테두리를 두르면
    그 크기에서 획이 잎을 다 갉아먹어 파란 얼룩이 된다.
    그래서 꽃 전체를 흰 덩어리 하나로 채우고, 잎 경계만 바탕색 선으로
    그어 넣었다. 작아지면 선이 사라지고 연꽃 실루엣만 남는다.
  -->
  <rect width="32" height="32" rx="7" fill="#1668d8"/>

  <!-- 꽃 실루엣 (바깥 잎 2 + 안쪽 잎 2 + 가운데 잎 1의 합집합) -->
  <path
    fill="#ffffff"
    d="M16 25.4c-6.6 0-11.9-3.1-13.9-8.2 4.4-1.6 8.4-.9 11.4 1.6-2.1-2.6-3.2-5.8-3.1-9.4
       2.2.9 4 2.3 5.2 4.1-.4-3.6.5-6.9 2.4-9.9 1.9 3 2.8 6.3 2.4 9.9
       1.2-1.8 3-3.2 5.2-4.1.1 3.6-1 6.8-3.1 9.4 3-2.5 7-3.2 11.4-1.6
       -2 5.1-7.3 8.2-13.9 8.2Z"
  />

  <!-- 잎 경계 — 큰 크기에서만 보이고 작아지면 자연스럽게 묻힌다 -->
  <g stroke="#1668d8" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M16 24.6 9.9 16.5"/>
    <path d="M16 24.6 22.1 16.5"/>
    <path d="M16 24.6V13.2"/>
  </g>
</svg>
